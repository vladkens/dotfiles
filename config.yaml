config:
  backup: false
  banner: false
  create: true
  diff_command: git diff --no-index --color=always -- {0} {1}
  dotpath: dotfiles
  link_dotfile_default: relative
  showdiff: true

dotfiles:
  fish:
    src: fish
    dst: ~/.config/fish
    link: link_children # fish writes fish_variables directly into this dir
  ghostty:
    src: ghostty
    dst: ~/.config/ghostty
  git:
    src: git
    dst: ~/.config/git
  mise:
    src: mise
    dst: ~/.config/mise
  revdiff:
    src: revdiff/config
    dst: ~/.config/revdiff/config
    chmod: "600"
  starship:
    src: starship/starship.toml
    dst: ~/.config/starship.toml
  sublime:
    src: sublime
    dst: ~/Library/Application Support/Sublime Text/Packages/User
    link: link_children # dir is shared with Package Control / other packages
  vscode:
    src: vscode
    dst: ~/Library/Application Support/Code/User
    link: link_children # dir also holds History/globalStorage/workspaceStorage/sync
  wezterm:
    src: wezterm
    dst: ~/.config/wezterm
  zed:
    src: zed
    dst: ~/.config/zed
    link: link_children # zed writes prompts/ (LMDB) and themes/ directly into this dir

profiles:
  default:
    dotfiles:
      - fish
      - ghostty
      - git
      - mise
      - revdiff
      - starship
      - sublime
      - vscode
      - wezterm
      - zed
