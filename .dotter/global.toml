"dotfiles/tmux.conf" = "~/.tmux.conf"
"dotfiles/vim" = { target = "~/.config/vim", type = "symbolic", recurse = false }
"dotfiles/vscode/keybindings.json" = "~/Library/Application Support/Code/User/keybindings.json"
