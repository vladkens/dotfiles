services:
  auth:
    image: codex-dkr-auth:local
    build: .
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - credentials:/auth:ro
    networks:
      shared:
        aliases: [codex-dkr-auth]
volumes:
  credentials:
    name: codex-dkr-auth
networks:
  shared:
    name: codex-dkr
