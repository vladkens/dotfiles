services:
  agent:
    image: codex-dkr:local
    build: .
    init: true
    volumes:
      - type: bind
        source: ${CODEX_WORKSPACE:?Run through codex-dkr}
        target: /workspace
      - home:/home/node
    networks: [shared]
volumes:
  home:
networks:
  shared:
    name: codex-dkr
    external: true
